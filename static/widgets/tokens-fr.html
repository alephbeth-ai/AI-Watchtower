    if(algo==='byte') return parseInt(t,16);
    if(algo==='bpe')  return BPE_IDS.has(t)?BPE_IDS.get(t):'?';
    if(algo==='word') return (t==='<UNK>')?0:(WORD_IDS.get(t.slice(1).toLowerCase())||0);
    return null;
  }
  function upd(){
    const algo=sel.value, toks=encodeWith(algo,inp.value);
    renderToks(out,toks,function(t,i){return idFor(algo,t,i);});
    cnt.textContent=toks.length+' tokens';
    ids.textContent='['+toks.map(function(t,i){
      const v=idFor(algo,t,i); return (v===null)?'·':v;
    }).join(', ')+']';
  }
  inp.oninput=upd; sel.onchange=upd; upd();
})();

/* ================================================================
   DÉMO 2 — curseur de granularité
   ================================================================ */
(function(){
  const TEST='La tokenisation détermine la longueur des séquences, le coût du calcul et la robustesse du système face aux attaques.';
  const range=document.getElementById('d2-range'), out=document.getElementById('d2-out');
  const lab=document.getElementById('d2-lab');
  const baseChars=new Set();
  preTok(CORPUS).forEach(function(w){ chars(w).forEach(function(c){baseChars.add(c);}); });
  const nWords=preTok(TEST).length;
  const pts=[];
  for(let m=0;m<=600;m+=25){
    const r=ranksOf(BPE_MERGES,m);
    pts.push({m:m, tok:bpeEncode(TEST,r).length, voc:baseChars.size+m});
  }
  const W=900,H=150,PL=58,PR=16,PT=14,PB=26;
  const maxT=Math.max.apply(null,pts.map(function(p){return p.tok;}));
  const minT=Math.min.apply(null,pts.map(function(p){return p.tok;}));
  function X(m){return PL+(m/600)*(W-PL-PR);}
  function Y(t){return PT+(1-(t-minT)/((maxT-minT)||1))*(H-PT-PB);}
  function chart(sel){
    const path=pts.map(function(p,i){return (i?'L':'M')+X(p.m).toFixed(1)+' '+Y(p.tok).toFixed(1);}).join(' ');
    let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
    g+='<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs>';
    g+='<line x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'" stroke="var(--line2)"/>';
    g+='<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(H-PB)+'" stroke="var(--line2)"/>';
    g+='<path d="'+path+'" fill="none" stroke="url(#gr)" stroke-width="2.5"/>';
    let p=pts[0];
    pts.forEach(function(q){ if(q.m===sel) p=q; });
    g+='<circle cx="'+X(p.m)+'" cy="'+Y(p.tok)+'" r="5" fill="var(--acc2)" stroke="var(--bg)" stroke-width="2"/>';
    g+='<text x="'+PL+'" y="'+(H-8)+'">0 fusion</text>';
    g+='<text x="'+(W-PR)+'" y="'+(H-8)+'" text-anchor="end">600 fusions</text>';
    g+='<text x="4" y="'+(PT+9)+'">'+maxT+' tokens</text>';
    g+='<text x="4" y="'+(H-PB)+'">'+minT+' tokens</text>';
    g+='</svg>';
    return g;
  }
  function upd(){
    const m=+range.value, r=ranksOf(BPE_MERGES,m);
    const toks=bpeEncode(TEST,r);
    renderToks(out,toks);
    document.getElementById('d2-chart').innerHTML=chart(m);
    document.getElementById('d2-tok').textContent=toks.length;
    document.getElementById('d2-voc').textContent=baseChars.size+m;
    document.getElementById('d2-fert').textContent=(toks.length/nWords).toFixed(2);
    lab.textContent='vocabulaire : '+(baseChars.size+m);
  }
  range.oninput=upd; upd();
})();

/* ================================================================
   DÉMO 3 — entraînement BPE pas à pas
   ================================================================ */
(function(){
  function fresh(){
    const f=new Map();
    preTok(CORPUS).forEach(function(w){ f.set(w,(f.get(w)||0)+1); });
    return {seqs:Array.from(f.entries()).map(function(e){return {sym:chars(e[0]),f:e[1]};}), merges:[]};
  }
  let st=fresh();
  let base=0; st.seqs.forEach(function(s){base+=s.sym.length*s.f;});
  const log=document.getElementById('d3-log'), nEl=document.getElementById('d3-n');
  const wordIn=document.getElementById('d3-word'), wordOut=document.getElementById('d3-word-out');
  const bar=document.getElementById('d3-bar'), stats=document.getElementById('d3-stats');
  function step(){
    const pairs=new Map();
    st.seqs.forEach(function(s){
      for(let j=0;j<s.sym.length-1;j++){
        const k=s.sym[j]+SEP+s.sym[j+1]; pairs.set(k,(pairs.get(k)||0)+s.f);
      }
    });
    if(!pairs.size) return false;
    let bk=null,bc=-1;
    pairs.forEach(function(c,k){ if(c>bc){bc=c;bk=k;} });
    const i=bk.indexOf(SEP), a=bk.slice(0,i), b=bk.slice(i+1);
    st.merges.push({a:a,b:b,count:bc});
    st.seqs.forEach(function(s){ s.sym=mergeSeq(s.sym,a,b); });
    const d=document.createElement('div');
    d.className='mergestep';
    d.innerHTML='<span style="color:var(--tx3)">#'+st.merges.length+'</span>'
      +'<span class="chip">'+disp(a)+'</span><span style="color:var(--tx3)">+</span>'
      +'<span class="chip">'+disp(b)+'</span><span style="color:var(--acc)">→</span>'
      +'<span class="chip" style="border-color:var(--acc)">'+disp(a+b)+'</span>'
      +'<span style="margin-left:auto;color:var(--tx3)">'+bc+'×</span>';
    log.insertBefore(d,log.firstChild);
    return true;
  }
  function refresh(){
    let tot=0; st.seqs.forEach(function(s){tot+=s.sym.length*s.f;});
    nEl.textContent=st.merges.length+' fusion'+(st.merges.length>1?'s':'');
    bar.style.width=(tot/base*100)+'%';
    stats.textContent=tot.toLocaleString('fr-FR')+' symboles / '+base.toLocaleString('fr-FR')
      +'  ('+(100-tot/base*100).toFixed(1)+' % de réduction)';
    renderToks(wordOut, bpeWord(SP+(wordIn.value||'test'), ranksOf(st.merges)));
  }
  document.getElementById('d3-step').onclick=function(){step();refresh();};
  document.getElementById('d3-run10').onclick=function(){for(let i=0;i<10;i++){if(!step())break;} refresh();};
  document.getElementById('d3-reset').onclick=function(){st=fresh();log.innerHTML='';refresh();};
  wordIn.oninput=refresh;
  refresh();
})();

/* ================================================================
   DÉMO 4 — coût en octets
   ================================================================ */
(function(){
  const inp=document.getElementById('d4-in'), out=document.getElementById('d4-out'), note=document.getElementById('d4-note');
  function upd(){
    const s=inp.value;
    const arr=Array.from(s);
    out.innerHTML=arr.map(function(ch,i){
      const n=TE.encode(ch).length;
      return '<span class="tok c'+(i%8)+'" title="'+n+' octet(s)">'+disp(ch===' '?SP:ch)
        +'<span style="opacity:.55;font-size:.78em"> '+n+'o</span></span>';
    }).join('');
    const bytes=TE.encode(s).length;
    note.textContent=arr.length+' caractères → '+bytes+' octets ('
      +(bytes/Math.max(1,arr.length)).toFixed(2)+' octet par caractère). '
      +'Un tokeniseur au niveau des octets travaille sur cette seconde longueur, pas sur la première.';
  }
  inp.oninput=upd; upd();
})();

/* ================================================================
   DÉMO 5 — comparateur
   ================================================================ */
(function(){
  const inp=document.getElementById('d5-in'), out=document.getElementById('d5-out');
  const ALGOS=[['bpe','BPE'],['wp','WordPiece'],['uni','Unigram / Viterbi'],['word','Mots'],['char','Caractères'],['byte','Octets UTF-8']];
  function upd(){
    const txt=inp.value;
    out.innerHTML='';
    const counts=ALGOS.map(function(a){return encodeWith(a[0],txt).length;});
    const mx=Math.max.apply(null,counts.concat([1]));
    ALGOS.forEach(function(a){
      const toks=encodeWith(a[0],txt);
      const d=document.createElement('div');
      d.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:6px">'
        +'<h4 style="margin:0">'+a[1]+'</h4><span class="tag">'+toks.length+' tokens</span></div>'
        +'<div class="bar" style="margin-bottom:8px"><i style="width:'+(toks.length/mx*100)+'%"></i></div>'
        +'<div class="tokline" style="font-size:13px">'
        +toks.slice(0,140).map(function(t,i){return '<span class="tok c'+(i%8)+'">'+disp(t)+'</span>';}).join('')
        +(toks.length>140?'<span class="tag">+'+(toks.length-140)+'</span>':'')+'</div>';
      out.appendChild(d);
    });
  }
  inp.oninput=upd;
  Array.prototype.slice.call(document.querySelectorAll('[data-d5]')).forEach(function(b){
    b.onclick=function(){
      Array.prototype.slice.call(document.querySelectorAll('[data-d5]')).forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); inp.value=b.dataset.d5; upd();
    };
  });
  upd();
})();

/* ================================================================
   DÉMO 6 — coût par langue
   ================================================================ */
(function(){
  const out=document.getElementById('d6-out');
  const S=[
    ['Français','Les modèles de langage découpent le texte avant de le comprendre.'],
    ['Anglais','Language models split text into pieces before understanding it.'],
    ['Allemand','Sprachmodelle zerlegen den Text, bevor sie ihn verstehen können.'],
    ['Turc','Dil modelleri metni anlamadan önce parçalara ayırır.'],
    ['Russe','Языковые модели разбивают текст перед тем, как понять его.'],
    ['Japonais','言語モデルはテキストを理解する前に分割します。'],
    ['Arabe','تقوم نماذج اللغة بتقسيم النص قبل فهمه.']
  ];
  const rows=S.map(function(s){
    return {n:s[0], t:s[1], tok:bpeEncode(s[1],BPE_RANKS).length, ch:Array.from(s[1]).length};
  });
  const ref=rows[0].tok/rows[0].ch;
  const mx=Math.max.apply(null,rows.map(function(r){return r.tok/r.ch;}));
  out.innerHTML=rows.map(function(r){
    const ratio=r.tok/r.ch;
    return '<div><div class="row" style="justify-content:space-between;margin-bottom:5px">'
      +'<span style="font-weight:650">'+r.n+'</span>'
      +'<span class="tag">'+r.tok+' tokens · '+ratio.toFixed(2)+' tok/car · ×'+(ratio/ref).toFixed(1)+' vs FR</span></div>'
      +'<div class="bar"><i style="width:'+(ratio/mx*100)+'%"></i></div>'
      +'<div class="hint" style="margin-top:4px">'+esc(r.t)+'</div></div>';
  }).join('');
})();

/* ================================================================
   DÉMO 7 — homoglyphes
   ================================================================ */
(function(){
  const MAP={a:'а',e:'е',o:'о',c:'с',p:'р',i:'і',s:'ѕ',x:'х',y:'у'};
  const inp=document.getElementById('d7-in');
  const A=document.getElementById('d7-a'), B=document.getElementById('d7-b');
  const AN=document.getElementById('d7-an'), BN=document.getElementById('d7-bn');
  let sub=false;
  function conv(s){ return Array.from(s).map(function(c){return MAP[c]||c;}).join(''); }
  function upd(){
    const a=inp.value, b=sub?conv(a):a;
    const ta=byteEncode(a), tb=byteEncode(b);
    document.getElementById('d7-at').textContent=a;
    document.getElementById('d7-bt').textContent=b;
    renderToks(A,ta); renderToks(B,tb);
    AN.textContent=ta.length+' octets · '+bpeEncode(a,BPE_RANKS).length+' tokens BPE';
    BN.textContent=tb.length+' octets · '+bpeEncode(b,BPE_RANKS).length+' tokens BPE'
      + (sub?'  ⚠ chaîne différente, rendu identique':'');
  }
  document.getElementById('d7-go').onclick=function(){sub=true;upd();};
  document.getElementById('d7-reset').onclick=function(){sub=false;upd();};
  inp.oninput=function(){sub=false;upd();};
  upd();
})();
