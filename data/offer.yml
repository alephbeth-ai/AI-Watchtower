fr:
  home:
    eyebrow: "Sécurité des agents IA"
    subtitle: "Audit, red teaming et protection en production, pour les entreprises et institutions qui confient des actions à des agents IA."
    see_services: "Voir nos services"
    risks_title: "Ce qu'un agent IA peut faire contre vous"
    risks_lead: "Un agent ne se contente pas de répondre : il lit, décide et agit dans vos outils. C'est ce passage à l'acte qui crée un risque nouveau."
    services_title: "Ce que nous faisons"
    services_lead: "Trois formats, du premier état des lieux à la mise en production maîtrisée."
    cred_title: "Pourquoi nous"
    latest_title: "Dernières publications"
    latest_all: "Toutes les publications"
    final_title: "Parlons de vos agents IA"
    final_text: "Décrivez-nous votre contexte en quelques lignes. Réponse sous 48 h ouvrées."
  risks:
    - title: "Détournement d'un agent"
      text: "Un agent qui lit un e-mail, une page web ou un document peut y trouver des instructions cachées et les exécuter pour le compte d'un attaquant, sans que personne ne clique sur quoi que ce soit."
    - title: "Fuite de données par l'agent"
      text: "Connecté à votre messagerie, vos fichiers ou votre CRM, un agent peut être amené à transmettre des données clients, des secrets ou des documents internes vers l'extérieur. Aucun système n'est « piraté » : l'agent a simplement obéi."
    - title: "Actions non autorisées"
      text: "Un agent capable d'envoyer, de payer, de modifier ou de supprimer peut le faire au mauvais moment, pour la mauvaise raison, et à une vitesse qu'aucune relecture humaine ne suit."
  services:
    - id: diagnostic
      name: "Diagnostic agents IA"
      duration: "2 jours"
      pitch: "Un état des lieux clair : quels agents, quels accès, quels risques prioritaires, et par quoi commencer."
      who: "Directions informatiques, RSSI et équipes produit qui déploient, ou s'apprêtent à déployer, un ou plusieurs agents IA."
      problem: "Vous ne savez pas précisément ce que vos agents peuvent faire, à quelles données ils accèdent, ni quels scénarios d'abus sont réalistes dans votre contexte."
      what: "Nous cartographions les agents, leurs outils, leurs données et leurs permissions. Nous revoyons l'architecture et les garde-fous existants, puis nous identifions les scénarios de risque prioritaires en langage métier."
      deliverables: "Rapport de diagnostic, carte des agents et de leurs accès, scénarios de risque hiérarchisés, plan d'action priorisé."
      how: "Entretiens avec vos équipes et lecture de l'architecture, à distance ou sur site. Aucun test intrusif à ce stade."
    - id: audit
      name: "Audit et red teaming d'agents IA"
      duration: "5 jours"
      flagship: true
      pitch: "Nous attaquons vos agents comme le ferait un adversaire, sur un périmètre autorisé, et nous vous montrons ce qui cède."
      who: "Organisations dont un agent est en production ou en préproduction : assistant interne, agent de support, automatisation documentaire, agent connecté à des outils métier."
      problem: "Votre agent est-il détournable ? Peut-on lui faire exfiltrer des données, abuser de ses outils, contourner ses consignes ou enchaîner des actions dangereuses ?"
      what: "Tests d'injection directe et indirecte, abus d'outils et de permissions, exfiltration par les canaux sortants, contournement des garde-fous, chaînes d'actions. Chaque scénario réussi est reproduit, documenté et classé par gravité."
      deliverables: "Rapport d'audit avec scénarios reproduits et preuves, cotation de gravité, recommandations concrètes classées par effort, restitution orale à vos équipes."
      how: "Périmètre et autorisation écrite définis avant tout test. Travail à distance ou sur site. Confidentialité contractuelle."
    - id: securisation
      name: "Sécurisation et accompagnement"
      duration: "10 jours ou plus"
      pitch: "Nous concevons avec vous les contrôles qui tiennent, puis nous restons jusqu'à ce qu'ils soient en place et vérifiés."
      who: "Équipes qui doivent corriger les constats d'un audit, concevoir un agent sûr dès le départ, ou maintenir un niveau de sécurité dans le temps."
      problem: "Les recommandations existent, mais les équipes manquent de temps, de méthode ou de recul pour les transformer en contrôles réellement efficaces."
      what: "Conception des contrôles hors du modèle : permissions minimales, filtrage des sorties, validation des actions sensibles, cloisonnement des données. Revue des correctifs, tests de non-régression, formation des équipes."
      deliverables: "Architecture cible, contrôles mis en place et documentés, jeux de tests rejouables, formation, support pendant la durée convenue."
      how: "Accompagnement par itérations, à distance ou sur site, en lien direct avec vos équipes techniques."
  services_page:
    intro: "Trois formats, pensés pour s'enchaîner ou se prendre séparément. Chaque mission commence par un périmètre écrit et se termine par une restitution."
    labels:
      who: "Pour qui"
      problem: "Problème traité"
      what: "Ce que nous faisons"
      deliverables: "Livrables"
      duration: "Durée type"
      how: "Comment on travaille"
      flagship: "Offre phare"
      price_from: "À partir de %s € HT"
    method_title: "Méthode"
    method_text: "Nos tests et nos recommandations s'appuient sur des référentiels publics, utilisés comme grilles de méthode. Nous ne délivrons aucune certification et ne revendiquons aucune conformité à ces cadres."
    method_refs:
      - "OWASP Top 10 for LLM Applications"
      - "OWASP Agentic Security Initiative"
      - "MITRE ATLAS"
      - "Règlement européen sur l'IA (AI Act)"
      - "Directive NIS2"
    frame_title: "Cadre"
    frame:
      - title: "Confidentialité"
        text: "Accord de confidentialité signé avant toute mission. Vos données ne quittent pas le périmètre convenu."
      - title: "Périmètre et autorisation"
        text: "Les tests ne portent que sur les systèmes que vous désignez, avec une autorisation écrite. Rien n'est testé en dehors."
      - title: "Rapport remis"
        text: "Chaque mission produit un rapport écrit, qui vous appartient, avec constats, preuves et recommandations."
      - title: "Restitution"
        text: "Une séance de restitution orale avec vos équipes clôt chaque mission."
    faq_title: "Questions fréquentes"
    faq:
      - q: "Quel périmètre pouvez-vous tester ?"
        a: "Tout agent ou assistant qui lit des contenus externes ou agit dans vos outils : assistants internes, agents de support, automatisations documentaires, intégrations MCP ou API. Le périmètre est défini ensemble, par écrit, avant la mission."
      - q: "Nos données sont-elles protégées ?"
        a: "Oui. Un accord de confidentialité est signé avant la mission, les tests se font sur les environnements que vous désignez, et nous ne conservons que ce qui est nécessaire au rapport."
      - q: "Combien de temps dure une mission ?"
        a: "Deux jours pour un diagnostic, cinq jours pour un audit, dix jours ou plus pour une sécurisation. Ces durées sont indicatives et ajustées au périmètre."
      - q: "Travaillez-vous à distance ?"
        a: "Oui, en France et à l'international, en français et en anglais. Une présence sur site est possible quand le contexte le demande."
      - q: "Que se passe-t-il après l'audit ?"
        a: "Vous recevez un rapport et une restitution. Vous pouvez corriger en interne, ou nous confier la sécurisation et l'accompagnement pour mettre les contrôles en place et les vérifier."
  guard:
    band_title: "Agent IA Guard : protéger les agents en production"
    band_text: "Notre produit est en développement, disponibilité prévue en 2027. Nous constituons un programme de partenaires pilotes."
    band_cta: "Découvrir le programme pilote"
    status: "En développement — disponibilité prévue en 2027"
    problem: "Un agent IA en production obéit à ce qu'il lit, pas seulement à ce qu'on lui demande. Les consignes placées dans le modèle ne constituent pas un contrôle d'accès : elles peuvent être contournées par le contenu qu'il traite."
    principle_title: "Principe à l'étude"
    principle: "Agent IA Guard vise à placer une couche de contrôle entre l'agent et ses outils, en dehors du modèle : les actions sensibles sont vérifiées selon des règles explicites avant d'être exécutées, quelles que soient les instructions reçues par l'agent."
    schema_caption: "Schéma de principe : à venir."
    validating_title: "Ce qui est en cours de validation"
    validating:
      - "Le périmètre des actions et des outils que la couche de contrôle peut couvrir."
      - "La manière de décrire les règles sans alourdir le travail des équipes."
      - "L'impact sur la latence et sur l'expérience des utilisateurs de l'agent."
      - "Les modes d'intégration avec les plateformes d'agents les plus répandues."
    audience_title: "Pour qui"
    audience: "Entreprises et institutions qui exploitent, ou prévoient d'exploiter, des agents IA connectés à des outils métier, et qui souhaitent participer à la définition du produit."
    pilot_title: "Programme de partenaires pilotes"
    pilot_text: "Les partenaires pilotes accèdent aux versions de travail, orientent les priorités et bénéficient de conditions préférentielles à l'ouverture. Le nombre de places est limité."
    pilot_cta: "Rejoindre le programme de partenaires pilotes"
    honest: "Les informations de cette page évolueront avec l'avancement du développement."
  credibility:
    - title: "Une expertise à trois entrées"
      text: "Mathématiques, cybersécurité et intelligence artificielle. Nous comprenons comment un modèle fonctionne, comment un attaquant raisonne et comment une organisation décide."
    - title: "Une recherche publiée"
      key: publications
      text: "%d analyses publiées en français et en anglais sur l'injection de prompts, l'empoisonnement, les agents et le durcissement, plus un lab d'outils interactifs."
    - title: "Une méthode référencée"
      text: "Tests et recommandations appuyés sur les référentiels publics du domaine, dans un cadre contractuel écrit : périmètre, autorisation, confidentialité, restitution."
  about:
    intro: "Aleph Beth est un cabinet indépendant dédié à la sécurité des agents IA. Nous aidons les entreprises et les institutions à comprendre ce que leurs agents peuvent faire, à le tester comme un adversaire le ferait, et à mettre en place des contrôles qui tiennent."
    expertise_title: "Expertise"
    expertise:
      - title: "Mathématiques"
        text: "Comprendre les modèles de l'intérieur : ce qu'un transformeur sait faire, ce qu'il ne garantit jamais, et pourquoi."
      - title: "Cybersécurité"
        text: "Modéliser les menaces, tester comme un attaquant, concevoir des contrôles déterministes hors du modèle."
      - title: "Intelligence artificielle"
        text: "Architectures d'agents, outils, mémoire, récupération de documents : là où le risque se déplace quand l'IA passe à l'acte."
    approach_title: "Approche"
    approach:
      - "Nous ne testons que sur un périmètre autorisé par écrit."
      - "Nous ne vendons pas de conformité : nous livrons des constats, des preuves et des recommandations."
      - "Nous publions notre recherche, parce qu'un domaine qui avance vite se défend mieux à découvert."
      - "Nous disons ce que nous ne savons pas encore, y compris sur notre propre produit."
    languages_title: "Langues"
    languages_text: "Missions en français et en anglais, en France et à distance à l'international."
    status_title: "Statut"
    research_link: "Lire nos publications"

en:
  home:
    eyebrow: "AI-agent security"
    subtitle: "Audit, red teaming and production hardening, for companies and institutions that let AI agents take actions."
    see_services: "See our services"
    risks_title: "What an AI agent can do against you"
    risks_lead: "An agent does more than answer: it reads, decides and acts inside your tools. That step into action is what creates a new kind of risk."
    services_title: "What we do"
    services_lead: "Three formats, from a first assessment to a controlled production rollout."
    cred_title: "Why us"
    latest_title: "Latest publications"
    latest_all: "All publications"
    final_title: "Let's talk about your AI agents"
    final_text: "Describe your context in a few lines. We answer within two business days."
  risks:
    - title: "Agent hijacking"
      text: "An agent that reads an e-mail, a web page or a document can find hidden instructions there and carry them out on behalf of an attacker, without anyone clicking on anything."
    - title: "Data leakage through the agent"
      text: "Connected to your mailbox, your files or your CRM, an agent can be led to send customer data, secrets or internal documents outside. Nothing gets \"hacked\": the agent simply obeyed."
    - title: "Unauthorised actions"
      text: "An agent able to send, pay, modify or delete can do so at the wrong time, for the wrong reason, and at a pace no human review can follow."
  services:
    - id: diagnostic
      name: "AI-agent diagnostic"
      duration: "2 days"
      pitch: "A clear picture: which agents, which access, which risks come first, and where to start."
      who: "IT leadership, CISOs and product teams that deploy, or are about to deploy, one or more AI agents."
      problem: "You do not know precisely what your agents can do, which data they reach, or which abuse scenarios are realistic in your context."
      what: "We map the agents, their tools, their data and their permissions. We review the architecture and existing guardrails, then identify the priority risk scenarios in business terms."
      deliverables: "Diagnostic report, map of agents and their access, ranked risk scenarios, prioritised action plan."
      how: "Interviews with your teams and a read-through of the architecture, remotely or on site. No intrusive testing at this stage."
    - id: audit
      name: "AI-agent audit and red teaming"
      duration: "5 days"
      flagship: true
      pitch: "We attack your agents the way an adversary would, within an authorised scope, and show you what gives way."
      who: "Organisations with an agent in production or pre-production: internal assistant, support agent, document automation, agent connected to business tools."
      problem: "Can your agent be hijacked? Can it be made to leak data, abuse its tools, bypass its instructions or chain dangerous actions?"
      what: "Direct and indirect injection tests, tool and permission abuse, exfiltration through outbound channels, guardrail bypass, action chains. Every successful scenario is reproduced, documented and rated by severity."
      deliverables: "Audit report with reproduced scenarios and evidence, severity rating, concrete recommendations ranked by effort, oral debrief with your teams."
      how: "Scope and written authorisation defined before any test. Remote or on-site work. Contractual confidentiality."
    - id: securisation
      name: "Hardening and support"
      duration: "10 days or more"
      pitch: "We design with you the controls that hold, then stay until they are in place and verified."
      who: "Teams that must fix audit findings, design a safe agent from the start, or keep a security level over time."
      problem: "The recommendations exist, but teams lack the time, the method or the perspective to turn them into controls that actually work."
      what: "Design of controls outside the model: least privilege, output filtering, validation of sensitive actions, data compartmentalisation. Review of fixes, regression tests, team training."
      deliverables: "Target architecture, implemented and documented controls, replayable test sets, training, support for the agreed period."
      how: "Iterative support, remote or on site, working directly with your technical teams."
  services_page:
    intro: "Three formats, designed to follow one another or to stand alone. Every engagement starts with a written scope and ends with a debrief."
    labels:
      who: "Who it is for"
      problem: "Problem addressed"
      what: "What we do"
      deliverables: "Deliverables"
      duration: "Typical duration"
      how: "How we work"
      flagship: "Flagship"
      price_from: "From €%s excl. VAT"
    method_title: "Method"
    method_text: "Our tests and recommendations rely on public frameworks, used as method grids. We issue no certification and claim no compliance with these frameworks."
    method_refs:
      - "OWASP Top 10 for LLM Applications"
      - "OWASP Agentic Security Initiative"
      - "MITRE ATLAS"
      - "EU AI Act"
      - "NIS2 Directive"
    frame_title: "Framework"
    frame:
      - title: "Confidentiality"
        text: "A non-disclosure agreement is signed before any engagement. Your data stays within the agreed scope."
      - title: "Scope and authorisation"
        text: "Tests cover only the systems you designate, under written authorisation. Nothing outside is touched."
      - title: "Written report"
        text: "Every engagement produces a written report that belongs to you, with findings, evidence and recommendations."
      - title: "Debrief"
        text: "An oral debrief with your teams closes every engagement."
    faq_title: "Frequently asked questions"
    faq:
      - q: "What scope can you test?"
        a: "Any agent or assistant that reads external content or acts inside your tools: internal assistants, support agents, document automations, MCP or API integrations. The scope is defined together, in writing, before the engagement."
      - q: "Is our data protected?"
        a: "Yes. A non-disclosure agreement is signed beforehand, tests run on the environments you designate, and we keep only what the report requires."
      - q: "How long does an engagement last?"
        a: "Two days for a diagnostic, five for an audit, ten or more for hardening. These durations are indicative and adjusted to the scope."
      - q: "Do you work remotely?"
        a: "Yes, in France and internationally, in French and in English. On-site presence is possible when the context calls for it."
      - q: "What happens after the audit?"
        a: "You receive a report and a debrief. You can fix things internally, or entrust us with hardening and support to put the controls in place and verify them."
  guard:
    band_title: "Agent IA Guard: protecting agents in production"
    band_text: "Our product is in development, expected in 2027. We are building a pilot partner programme."
    band_cta: "Discover the pilot programme"
    status: "In development — expected in 2027"
    problem: "An AI agent in production obeys what it reads, not only what it is asked. Instructions placed inside the model are not an access control: they can be bypassed by the content the agent processes."
    principle_title: "Principle under study"
    principle: "Agent IA Guard aims to place a control layer between the agent and its tools, outside the model: sensitive actions are checked against explicit rules before they run, whatever instructions the agent has received."
    schema_caption: "Principle diagram: coming soon."
    validating_title: "What is being validated"
    validating:
      - "The range of actions and tools the control layer can cover."
      - "How to express rules without adding burden on teams."
      - "The impact on latency and on the agent's user experience."
      - "Integration paths with the most common agent platforms."
    audience_title: "Who it is for"
    audience: "Companies and institutions that run, or plan to run, AI agents connected to business tools, and want a say in how the product is shaped."
    pilot_title: "Pilot partner programme"
    pilot_text: "Pilot partners get access to working versions, steer priorities and benefit from preferential terms at launch. Places are limited."
    pilot_cta: "Join the pilot partner programme"
    honest: "The information on this page will evolve as development progresses."
  credibility:
    - title: "Expertise with three entry points"
      text: "Mathematics, cybersecurity and artificial intelligence. We understand how a model works, how an attacker reasons and how an organisation decides."
    - title: "Published research"
      key: publications
      text: "%d analyses published in French and English on prompt injection, poisoning, agents and hardening, plus a lab of interactive tools."
    - title: "A referenced method"
      text: "Tests and recommendations grounded in the field's public frameworks, within a written contractual frame: scope, authorisation, confidentiality, debrief."
  about:
    intro: "Aleph Beth is an independent practice dedicated to AI-agent security. We help companies and institutions understand what their agents can do, test it the way an adversary would, and put in place controls that hold."
    expertise_title: "Expertise"
    expertise:
      - title: "Mathematics"
        text: "Understanding models from the inside: what a transformer can do, what it never guarantees, and why."
      - title: "Cybersecurity"
        text: "Modelling threats, testing like an attacker, designing deterministic controls outside the model."
      - title: "Artificial intelligence"
        text: "Agent architectures, tools, memory, document retrieval: where the risk moves when AI takes action."
    approach_title: "Approach"
    approach:
      - "We only test within a scope authorised in writing."
      - "We do not sell compliance: we deliver findings, evidence and recommendations."
      - "We publish our research, because a fast-moving field defends itself better in the open."
      - "We say what we do not know yet, including about our own product."
    languages_title: "Languages"
    languages_text: "Engagements in French and English, in France and remotely worldwide."
    status_title: "Status"
    research_link: "Read our publications"
