# ─── Configuration centrale du site ──────────────────────────────────────────
# Un seul interrupteur : launch_mode.
#   "pre"  : société en cours de création. Aucun tarif, aucune mention légale
#            d'entité, formulaire = liste d'attente.
#   "open" : missions ouvertes. Mentions légales complètes, tarifs indicatifs,
#            lien de prise de rendez-vous.
# Toute valeur vide n'affiche rien (jamais de champ vide visible).

launch_mode: "pre"            # "pre" | "open"
launch_date_label: "janvier 2027"
launch_date_label_en: "January 2027"

brand: "Aleph Beth"
# Graphies de la marque dans les écritures sémitiques (hébreu, arabe),
# affichées à côté du nom.
brand_scripts: "אב · أب"
tagline_fr: "Nous encadrons les agents IA qui lisent, mémorisent et agissent sur vos outils métier."
tagline_en: "We govern AI agents that read, remember and act across your business tools."

contact:
  email: "contact@alephbeth.ai"   # déjà publique sur le site précédent
  form_endpoint: ""               # TODO : URL du service de formulaire (Formspree)
  booking_url: ""                 # optionnel, affiché seulement en mode "open"
  linkedin_url: ""                # TODO : page LinkedIn de l'entreprise

legal:                            # affiché seulement en mode "open"
  company_name: ""                # TODO-LEGAL
  legal_form: ""                  # TODO-LEGAL
  siret: ""                       # TODO-LEGAL
  address: ""                     # TODO-LEGAL
  publication_director: ""        # TODO-LEGAL
