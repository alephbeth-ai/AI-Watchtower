baseURL = "https://www.alephbeth.ai/"
title = "Aleph Beth"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Keep the feed addresses of the previous site: /rss.xml and /fr/rss.xml
[outputFormats.RSS]
  baseName = "rss"

[params]
  env = "production"
  author = "Aleph Beth"
  description = "AI-agent security: audit, red teaming and production hardening. Research on prompt injection, MCP, agent threat models."
  images = ["og-image.jpg"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true
  TocOpen = false
  comments = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false

  [params.label]
    text = "Aleph Beth"

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false
    favicon = "favicon-32.png"
    favicon16x16 = "favicon-32.png"
    favicon32x32 = "favicon-32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "favicon-192.png"
    theme_color = "#080d1a"
    msapplication_TileColor = "#080d1a"

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2

# ─── Multilingual ────────────────────────────────────────────────────────────
# English at the root (/), French under /fr/ — unchanged from the previous site
# so that every existing address keeps working (decision of 2026-10-13).

[languages]

  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "Aleph Beth"
    [languages.en.params]
      description = "AI-agent security: audit, red teaming and production hardening. Research on prompt injection, MCP server security, agent threat models and hardening playbooks."
    [[languages.en.menus.main]]
      identifier = "services"
      name = "Services"
      pageRef = "/services"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "guard"
      name = "Agent IA Guard"
      pageRef = "/agent-ia-guard"
      weight = 20
    [[languages.en.menus.main]]
      identifier = "about"
      name = "About"
      pageRef = "/about"
      weight = 40
    [[languages.en.menus.main]]
      identifier = "research"
      name = "Research"
      pageRef = "/posts"
      weight = 30
    [[languages.en.menus.main]]
      identifier = "lab"
      name = "Lab"
      pageRef = "/lab"
      weight = 45
    [[languages.en.menus.main]]
      identifier = "contact"
      name = "Contact"
      pageRef = "/contact"
      weight = 50

  [languages.fr]
    label = "Français"
    locale = "fr-FR"
    contentDir = "content/fr"
    weight = 2
    title = "Aleph Beth"
    [languages.fr.params]
      description = "Sécurité des agents IA : audit, red teaming et protection en production. Recherche sur l'injection de prompts, la sécurité des serveurs MCP, les modèles de menace agentiques et le durcissement."
    [[languages.fr.menus.main]]
      identifier = "services"
      name = "Services"
      pageRef = "/services"
      weight = 10
    [[languages.fr.menus.main]]
      identifier = "guard"
      name = "Agent IA Guard"
      pageRef = "/agent-ia-guard"
      weight = 20
    [[languages.fr.menus.main]]
      identifier = "about"
      name = "À propos"
      pageRef = "/a-propos"
      weight = 40
    [[languages.fr.menus.main]]
      identifier = "research"
      name = "Recherche"
      pageRef = "/posts"
      weight = 30
    [[languages.fr.menus.main]]
      identifier = "lab"
      name = "Lab"
      pageRef = "/lab"
      weight = 45
    [[languages.fr.menus.main]]
      identifier = "contact"
      name = "Contact"
      pageRef = "/contact"
      weight = 50
